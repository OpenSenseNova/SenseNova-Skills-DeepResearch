version: 1
description: >-
  报告内容组织模板。模板约束必须回答的问题和证据组织方式，不规定固定章节标题，
  也不控制 Markdown、HTML、PDF 或 Word 的视觉样式。

templates:
  - id: competitive_analysis
    name: 竞品分析
    description: 对多个公司、产品或服务按统一口径进行系统比较。
    match_signals:
      intents: [竞品分析, 竞争格局, 产品对比, 公司对比, 优劣势分析]
      relationships: [多个同类对象, 统一评价维度, 横向比较]
    required_elements:
      - id: comparison_scope
        purpose: 明确比较对象、市场边界、时间范围和不纳入比较的内容。
      - id: evaluation_criteria
        purpose: 建立适用于全部对象的统一比较维度和指标口径。
      - id: competitor_profiles
        purpose: 提供各对象的定位、核心能力、目标用户和关键事实。
      - id: comparison_matrix
        purpose: 用同一组指标呈现对象之间可验证的差异。
      - id: strengths_and_weaknesses
        purpose: 基于证据解释各对象的相对优势、短板和限制条件。
      - id: scenario_fit
        purpose: 说明不同对象分别适合哪些用户、任务和约束条件。
      - id: conclusion
        purpose: 总结竞争位置、关键分化点和仍然存在的证据缺口。
    preferred_visuals: [comparison-table, scorecard, quadrant-chart, entity-profile-card]
    planning_rules:
      - 所有主要对象必须使用同一套核心比较口径。
      - 核心维度应覆盖全部主要对象，缺失信息必须明确标注。
      - 区分企业自述、第三方评价和可独立验证的事实。
    writing_rules:
      - 不按对象简单堆叠资料，应围绕比较维度组织主要分析。
      - 优劣势必须说明参照对象、适用条件和证据来源。

  - id: timeline_evolution
    name: 时间线演进
    description: 解释技术、行业、政策或事件如何随时间发展和转折。
    match_signals:
      intents: [发展历程, 时间线, 演进, 历史回顾, 关键节点, 趋势变化]
      relationships: [时间顺序, 阶段变化, 转折事件, 前后因果]
    required_elements:
      - id: scope_and_period
        purpose: 明确研究对象、时间起止点和事件纳入标准。
      - id: starting_conditions
        purpose: 描述演进开始时的背景、约束和初始状态。
      - id: stages
        purpose: 将连续变化划分为有证据支持的阶段。
      - id: milestones
        purpose: 记录改变发展方向或速度的关键事件。
      - id: drivers_and_constraints
        purpose: 分析各阶段的推动因素、阻碍因素和外部环境。
      - id: current_state
        purpose: 说明截至研究时间点的最新状态。
      - id: outlook
        purpose: 在证据允许范围内总结趋势和不确定性。
    preferred_visuals: [timeline, flowchart, metric-strip]
    planning_rules:
      - 每个关键事件都应包含时间、主体、发生内容和来源。
      - 阶段划分必须有可解释的变化依据，不能只按年份平均切分。
      - 区分时间上的先后关系与有来源支持的因果关系。
    writing_rules:
      - 以阶段和转折点组织正文，不写成孤立事件清单。
      - 对日期或不同来源间的冲突保留口径说明。

  - id: market_analysis
    name: 市场分析
    description: 研究市场边界、规模、参与者、增长动力和机会风险。
    match_signals:
      intents: [市场研究, 市场规模, 行业分析, 竞争格局, 增长机会]
      relationships: [供需关系, 市场参与者, 价值链, 增长驱动]
    required_elements:
      - id: market_definition
        purpose: 定义市场口径、地域、产品范围和统计时间。
      - id: size_and_growth
        purpose: 呈现市场规模、增速、预测及其计算口径。
      - id: segmentation
        purpose: 按客户、产品、地区或价值链拆分市场。
      - id: participants
        purpose: 识别主要参与者、份额、定位和竞争关系。
      - id: drivers
        purpose: 解释需求、技术、政策和资本等增长驱动因素。
      - id: barriers_and_risks
        purpose: 分析进入壁垒、替代风险、周期性和数据限制。
      - id: opportunities
        purpose: 总结有证据支持的市场机会及其成立条件。
    preferred_visuals: [bar-chart, distribution-chart, comparison-table, flowchart]
    planning_rules:
      - 市场数字必须记录统计口径、币种、地区、时间和来源。
      - 不同机构数据口径不一致时不得直接合并或比较。
      - 市场预测必须注明预测者、基准年份和关键假设。
    writing_rules:
      - 先定义市场再引用规模数字。
      - 将观察到的事实、机构预测和报告判断明确分开。

  - id: decision_comparison
    name: 方案对比与选型
    description: 围绕具体决策目标比较候选方案并给出条件化建议。
    match_signals:
      intents: [选型, 选择方案, 采购建议, 技术决策, 哪个更好, 推荐]
      relationships: [候选方案, 决策标准, 权衡, 场景适配]
    required_elements:
      - id: decision_context
        purpose: 明确决策者、目标、使用场景、硬约束和时间范围。
      - id: candidates
        purpose: 确认候选方案及其可比边界。
      - id: criteria
        purpose: 建立与决策目标相关的评价标准和优先级。
      - id: evidence_matrix
        purpose: 按统一标准展示每个候选方案的事实依据。
      - id: tradeoffs
        purpose: 分析成本、收益、风险和实施难度之间的权衡。
      - id: scenario_recommendations
        purpose: 针对不同条件给出相应选择，而不是无条件排名。
      - id: next_steps
        purpose: 给出验证假设、试点或采购前仍需完成的行动。
    preferred_visuals: [comparison-table, scorecard, quadrant-chart, checklist]
    planning_rules:
      - 评价标准必须来自用户目标和约束，不能使用通用指标凑表格。
      - 每个候选方案必须覆盖所有关键标准，缺失项明确标注未知。
      - 建议所依据的核心证据必须可追溯。
    writing_rules:
      - 推荐必须说明适用条件、关键假设和可能改变结论的因素。
      - 不以总分替代重要的定性权衡。

  - id: technology_evaluation
    name: 技术评估
    description: 评估技术、框架、模型或架构的能力、成熟度和适用边界。
    match_signals:
      intents: [技术评估, 架构分析, 框架调研, 可行性分析, 成熟度评估]
      relationships: [原理与能力, 性能与成本, 成熟度, 使用边界]
    required_elements:
      - id: problem_and_scope
        purpose: 定义技术要解决的问题、评估范围和目标环境。
      - id: mechanism
        purpose: 解释核心原理、架构和依赖关系。
      - id: capabilities
        purpose: 评估主要能力及其可验证依据。
      - id: maturity
        purpose: 分析稳定性、生态、维护状态和生产采用情况。
      - id: performance_and_cost
        purpose: 比较性能、资源、成本和运维要求。
      - id: limitations_and_risks
        purpose: 说明安全性、可靠性、兼容性和已知限制。
      - id: applicability
        purpose: 给出适用场景、不适用场景和验证建议。
    preferred_visuals: [flowchart, comparison-table, scorecard, concept-illustration]
    planning_rules:
      - 优先使用官方文档、基准测试、代码仓库和生产案例。
      - 性能数据必须保留测试环境、版本和负载条件。
      - 区分设计能力、演示能力和生产可用性。
    writing_rules:
      - 避免把功能列表当作技术评估结论。
      - 对缺少独立验证的厂商声明明确标注来源属性。

  - id: policy_analysis
    name: 政策分析
    description: 分析政策法规的背景、条款、执行机制和影响。
    match_signals:
      intents: [政策分析, 法规解读, 监管影响, 合规研究, 政策比较]
      relationships: [规则与主体, 权利义务, 执行时间, 监管影响]
    required_elements:
      - id: policy_context
        purpose: 说明政策背景、目标、发布机构和法律层级。
      - id: scope_and_definitions
        purpose: 明确适用对象、地域、关键定义和例外情况。
      - id: obligations
        purpose: 提取主要要求、禁止事项、权利和责任。
      - id: implementation_timeline
        purpose: 呈现发布、生效、过渡期和后续规则时间点。
      - id: stakeholders
        purpose: 分析不同利益相关方受到的具体影响。
      - id: enforcement_and_risks
        purpose: 说明执行机构、处罚、监管不确定性和合规风险。
      - id: response_options
        purpose: 提供基于政策文本的应对方向和待确认事项。
    preferred_visuals: [timeline, checklist, flowchart, comparison-table]
    planning_rules:
      - 以正式法律文本和主管机关资料为主要依据。
      - 明确区分已生效规则、草案、征求意见稿和媒体报道。
      - 保留司法辖区、版本、生效时间和例外条款。
    writing_rules:
      - 不把一般信息写成确定的法律意见。
      - 引用具体条款时必须保留上下文和适用范围。

  - id: risk_assessment
    name: 风险评估
    description: 识别、评估和排序风险，并提出可执行的缓解措施。
    match_signals:
      intents: [风险评估, 尽职调查, 风险识别, 安全评估, 风险控制]
      relationships: [风险来源, 发生概率, 影响, 控制措施]
    required_elements:
      - id: assessment_scope
        purpose: 明确评估对象、环境、时间窗口和风险口径。
      - id: risk_inventory
        purpose: 系统识别不同类别的风险事件和触发条件。
      - id: evidence_and_history
        purpose: 收集历史事件、漏洞、争议和控制有效性证据。
      - id: likelihood_and_impact
        purpose: 评估发生可能性、影响范围和严重程度。
      - id: prioritization
        purpose: 根据一致标准确定风险优先级。
      - id: mitigations
        purpose: 给出预防、监测、响应和转移措施。
      - id: residual_risk
        purpose: 说明采取措施后仍存在的风险和监测指标。
    preferred_visuals: [scorecard, quadrant-chart, checklist, flowchart]
    planning_rules:
      - 风险必须写成可发生的具体事件，而不是宽泛主题。
      - 概率和影响评级需要说明依据，不能伪造精确数字。
      - 缓解措施应对应具体风险及其触发因素。
    writing_rules:
      - 区分已发生事件、已知弱点和假设风险。
      - 高风险结论必须同时呈现证据强度和不确定性。

  - id: case_study
    name: 案例研究
    description: 深入分析一个组织、项目、产品或事件的过程与结果。
    match_signals:
      intents: [案例研究, 复盘, 成功经验, 失败原因, 实践分析]
      relationships: [背景与行动, 实施过程, 结果, 经验迁移]
    required_elements:
      - id: case_selection
        purpose: 说明案例对象、代表性、时间和分析边界。
      - id: context
        purpose: 描述行动发生前的目标、资源和外部条件。
      - id: approach
        purpose: 还原关键决策、实施步骤和参与者。
      - id: outcomes
        purpose: 呈现可验证的结果、指标和非预期后果。
      - id: contributing_factors
        purpose: 分析影响结果的内部因素和外部因素。
      - id: limitations
        purpose: 说明材料缺口、归因限制和案例特殊性。
      - id: transferable_lessons
        purpose: 总结可复用经验及其成立条件。
    preferred_visuals: [timeline, flowchart, metric-strip, key-fact-callout]
    planning_rules:
      - 尽量同时收集实施方、一手记录和独立评价。
      - 结果指标应保留基线、时间和测量口径。
      - 不能仅凭结果发生在行动之后就建立因果关系。
    writing_rules:
      - 将事实过程、参与方解释和报告推断分开表达。
      - 可复用经验必须说明与原案例环境的差异。

  - id: general_research
    name: 通用研究
    description: 用于没有明显专属结构、但仍需要系统取证和综合分析的任务。
    match_signals:
      intents: [综合研究, 情况分析, 主题调研, 问题研究]
      relationships: [多个主题, 多类证据, 综合解释]
    required_elements:
      - id: question_and_scope
        purpose: 定义核心问题、研究范围、时间和术语。
      - id: background
        purpose: 提供理解问题所必需的背景事实。
      - id: key_findings
        purpose: 按研究问题组织最重要的事实和来源观点。
      - id: analysis
        purpose: 综合比较证据、分歧、关系和限制。
      - id: implications
        purpose: 说明发现对用户问题意味着什么。
      - id: conclusion
        purpose: 回答核心问题并呈现不确定性和证据缺口。
    preferred_visuals: [comparison-table, timeline, flowchart, key-fact-callout]
    planning_rules:
      - 研究维度必须直接服务于核心问题。
      - 优先补齐基础对象、定义、关键属性和时间信息。
      - 对相互冲突的来源保留双方证据和口径差异。
    writing_rules:
      - 围绕用户问题组织内容，不按搜索来源依次摘要。
      - 结论只能延伸到现有证据能够支持的范围。

version: 1
name: annual_report_sec
script: providers/annual_report_sec.py
args: [sec-filings, --ticker, "{query}", --limit, "{limit}"]
capability: SEC annual filing discovery for public issuers.
query_style: The query must be a US ticker symbol; resolve a company name to a ticker before selecting this route.
result_semantics: Returns official SEC filing document candidates, not extracted filing facts.
result_shape: annual_report_sec
max_parallel: 1
optional_env: [YEAR_REPORT_USER_AGENT, SEC_USER_AGENT]

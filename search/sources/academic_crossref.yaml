version: 1
name: academic_crossref
script: providers/academic/crossref_search.py
args: ["{query}", --limit, "{limit}"]
capability: Crossref scholarly work and DOI discovery with publisher bibliographic metadata.
query_style: Use a paper title, author, topic, method, or compact scholarly keyword expression.
result_semantics: Crossref metadata identifies publications but does not independently verify the paper's claims.
max_parallel: 3
required_modules: [httpx]
optional_env: [CROSSREF_MAILTO, CLAWDBOT_EMAIL]

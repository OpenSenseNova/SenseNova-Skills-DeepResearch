version: 1
id: final-review-diagnostic
kind: agent
prompt_bundle_key: FinalReview
repair_on_validation_failure: false
inputs:
  report:
    type: stitched-report
    media_type: text/markdown
    mode: one
  plan:
    type: research-plan
    media_type: application/json
    mode: one
  evidence:
    type: evidence
    media_type: application/json
    mode: all
  outline:
    type: report-outline
    media_type: application/json
    mode: one
  drafts:
    type: report-draft
    media_type: text/markdown
    mode: all
  supplement-plans:
    type: supplement-plan
    media_type: application/json
    mode: all
    required: false
  reviews:
    type: review
    media_type: text/markdown
    mode: all
    required: false
  perspectives:
    type: perspective
    media_type: text/markdown
    mode: all
    required: false
outputs:
  review:
    path: final-review.md
    type: final-review
    media_type: text/markdown
    mode: state
  decision:
    path: decision.json
    type: final-repair-decision
    media_type: application/json
    mode: state
    required: false
  repair-tasks:
    path: repair-tasks/*.json
    type: final-repair-task
    media_type: application/json
    mode: batch
    required: false
    scope_key: content-unit-id
  recheck-tasks:
    path: recheck-tasks/*.json
    type: final-recheck-task
    media_type: application/json
    mode: batch
    required: false
    scope_key: repair-cycle-id
materializer: [python, -m, deepresearch_cli.final_repair_planner_node]
validator: [python, -m, deepresearch_cli.node_validators.final_review_diagnostic]
